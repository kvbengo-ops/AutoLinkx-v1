name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: Database permissions (disposable Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # A throwaway stack in the runner. No hosted project is contacted and no
      # secret is needed, so this runs for pull requests from forks too.
      - name: Start local Supabase
        run: supabase start

      # `supabase start` applies the migration history to an empty database,
      # so a green run proves migrations apply from scratch.
      - name: Publish local credentials to the job
        run: |
          # `supabase status -o env` quotes its values, so source the file and
          # let the shell strip the quotes. Writing those lines into GITHUB_ENV
          # directly leaves the quotes inside the value, and the URL check then
          # rejects a perfectly good address.
          supabase status -o env > supabase.env
          set -a
          # shellcheck disable=SC1091
          . ./supabase.env
          set +a
          {
            echo "SUPABASE_URL=${API_URL}"
            echo "SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
            echo "APP_URL=http://localhost:3000"
            echo "MARKETPLACE_CURRENCY=PHP"
            echo "LISTING_PHOTOS_BUCKET=listing-photos"
            echo "LOG_LEVEL=error"
          } >> "$GITHUB_ENV"
          rm supabase.env

      - name: Confirm the stack is reachable before trusting the tests
        run: |
          # The integration tests skip themselves when they cannot reach the
          # stack, so without this a misconfigured job would pass by skipping.
          curl --fail --silent --show-error "$SUPABASE_URL/auth/v1/health" > /dev/null
          echo "Auth is reachable at $SUPABASE_URL"

      # These are the tests that skip themselves when no stack is reachable.
      # Running them here is the difference between "green" and "verified".
      - name: Permission and account tests
        run: npm test

      - name: Fail if generated types drift from the migrations
        run: |
          npm run db:types
          git diff --exit-code src/server/database.types.ts \
            || (echo "::error::src/server/database.types.ts is out of date. Run npm run db:types and commit it." && exit 1)

      - name: Stop local Supabase
        if: always()
        run: supabase stop
# Untrusted pull requests receive no secrets: both jobs use only the throwaway
# stack above. Staging and production credentials belong to the deployment
# workflow (A-23), not here.
